<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主题色卡 · 交互预览（右键气泡 → 修改主题）</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0A0E15;color:#E8EDF7;
    font-family:"Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .bar{position:fixed;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;z-index:20;
    background:rgba(12,17,25,.92);border-bottom:1px solid rgba(255,255,255,.07)}
  .bar .t{font:600 10px/1 "Bahnschrift",sans-serif;letter-spacing:.22em;color:#69748A;margin-right:6px}
  .bar button{height:28px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);color:#D6DDEA;font-size:12px;cursor:pointer;font-family:inherit}
  .bar button.on{background:#E8EDF7;color:#0B1018;border-color:#E8EDF7;font-weight:600}
  .bar .hint{margin-left:auto;font-size:11.5px;color:#69748A}
  .bar .hint b{color:#AEB9CC;font-weight:600}

  /* ---------- 桌面底板 ---------- */
  .stage{position:absolute;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;gap:16px;
    background:
      radial-gradient(70% 60% at 50% 18%,rgba(46,74,120,.20),transparent 70%),
      linear-gradient(160deg,#0E141D,#080B11)}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(40% 40% at 78% 82%,rgba(24,52,60,.16),transparent 70%)}

  /* ---------- 卡片本体（和真程序一样 224×68 / 圆角 14） ---------- */
  .card{position:relative;z-index:2;width:224px;height:68px;border-radius:14px;border:1px solid var(--edge);
    background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--tx);flex:none;
    box-shadow:0 0 26px color-mix(in srgb,var(--ac) 32%,transparent),0 14px 30px rgba(0,0,0,.40);
    transition:background .18s ease,color .18s ease}
  .card .dot{position:absolute;left:14px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--ac);
    box-shadow:0 0 7px var(--ac)}
  .card .lab{position:absolute;left:24px;top:8px;font-size:9.5px;color:var(--mu)}
  .card .rt{position:absolute;right:14px;top:8px;font-size:9.5px;color:var(--mu)}
  .card .num{position:absolute;left:11px;top:21px;font:700 23px/27px "Consolas",monospace;letter-spacing:.01em}
  .card .bar2{position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:2px;background:var(--trk)}
  .card .bar2 i{position:absolute;inset:0;width:62%;border-radius:2px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 55%,transparent),var(--ac))}

  /* ---------- 气泡面板（246 宽，和真程序一致） ---------- */
  .bubble{position:relative;z-index:2;width:246px;flex:none;border-radius:18px;
    background:linear-gradient(180deg,var(--surf1),var(--bg2));border:1px solid var(--edge);
    box-shadow:0 22px 48px rgba(0,0,0,.52);overflow:hidden}
  .phead{display:flex;align-items:center;gap:8px;height:40px;padding:0 13px;
    border-bottom:1px solid color-mix(in srgb,var(--edge) 60%,transparent)}
  .phead svg{width:15px;height:15px;fill:none;stroke:var(--ac);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .phead .lbl{font-size:11.5px;color:var(--tx)}
  .phead .cnt{margin-left:auto;font-size:9.5px;color:var(--dm)}

  .view{overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-width:none;overscroll-behavior:contain}
  .view::-webkit-scrollbar{display:none}
  .grid{display:grid;gap:8px;align-content:start}

  /* 色卡 */
  .tc{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;flex:none;
    border:1px solid color-mix(in srgb,var(--edge) 55%,transparent);
    background:linear-gradient(180deg,var(--c1),var(--c2));
    display:flex;align-items:center;
    transition:transform .14s ease,box-shadow .14s ease}
  .tc:hover{transform:translateY(-1px)}
  .tc.sel{box-shadow:0 0 0 2px var(--ac),0 0 0 4px rgba(6,10,18,.55)}
  .sw{flex:none;background:var(--ca)}
  .nm{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
    color:var(--ctx);overflow:hidden;text-align:center}
  .nm i{font-style:normal;display:block;line-height:1.06}
  .v-a .nm,.v-b .nm,.v-d .nm{flex-direction:column}

  /* 方案 A：两列 105×62 */
  .v-a .grid{grid-template-columns:repeat(2,1fr)}
  .v-a .view{height:206px}
  .v-a .tc{height:62px;padding:5px;gap:6px}
  .v-a .sw{width:52px;height:52px;border-radius:9px}
  .v-a .nm{font-size:9.5px;letter-spacing:.10em;line-height:1.1}

  /* 方案 B：一行一张 222×131 */
  .v-b .grid{grid-template-columns:1fr;gap:10px}
  .v-b .view{height:292px}
  .v-b .tc{height:131px;padding:11px;gap:14px}
  .v-b .sw{width:109px;height:109px;border-radius:16px}
  .v-b .nm{font-size:19px;letter-spacing:.14em;line-height:1.1;padding-right:8px}

  /* 方案 C：一行一张扁卡 222×64，名字横排 */
  .v-c .grid{grid-template-columns:1fr;gap:8px}
  .v-c .view{height:222px}
  .v-c .tc{height:64px;padding:6px;gap:9px}
  .v-c .sw{width:52px;height:52px;border-radius:9px}
  .v-c .nm{font-size:11.5px;letter-spacing:.02em;justify-content:flex-start;padding-left:2px;gap:0}
  .v-c .nm i{display:inline}

  /* 方案 D：4 列 × 3 行 = 12 张，面板高度和现在一样（106） */
  .v-d .grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .v-d .view{height:130px;padding:8px}
  .v-d .tc{height:34px;padding:3px;gap:4px;border-radius:8px}
  .v-d .sw{width:27px;height:27px;border-radius:6px}
  .v-d .nm{font-size:9px;letter-spacing:0;line-height:1.04;padding-right:1px}
  .v-d .nm i{line-height:1.04}
  .v-d .tc.sel{box-shadow:0 0 0 1.5px var(--ac),0 0 0 3px rgba(6,10,18,.5)}
  /* 方案 0：现在这样（4 列小色块 + 底边高亮条） */
  .v-0 .grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .v-0 .view{height:172px}
  .v-0 .tc{height:26px;padding:0}
  .v-0 .sw{position:absolute;left:2px;right:2px;bottom:2px;height:3px;width:auto;border-radius:2px}
  .v-0 .nm{display:none}

  .newbtn{display:flex;align-items:center;gap:8px;height:38px;margin:0 10px 10px;padding:0 11px;border-radius:10px;
    background:color-mix(in srgb,var(--ac) 9%,transparent);
    border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);color:var(--ac);font-size:11px;cursor:pointer}
  .newbtn .plus{width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
  .newbtn .tip{margin-left:auto;font-size:8.5px;color:var(--dm)}

  /* 滚动指示条 */
  .sbar{position:absolute;right:4px;top:50px;bottom:58px;width:3px;border-radius:2px;
    background:color-mix(in srgb,var(--tx) 8%,transparent);pointer-events:none}
  .sbar i{position:absolute;left:0;width:3px;border-radius:2px;background:color-mix(in srgb,var(--tx) 34%,transparent)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);opacity:0;pointer-events:none;
    background:rgba(10,14,21,.94);border:1px solid rgba(255,255,255,.12);border-radius:12px;
    padding:10px 16px;font-size:12px;color:#DCE3F0;transition:opacity .18s ease,transform .18s ease;max-width:560px;line-height:1.6}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast b{color:#fff}
</style>
</head>

function luma(hex){

function mix(hex, other, t){
  var a = [parseInt(hex.substr(1,2),16), parseInt(hex.substr(3,2),16), parseInt(hex.substr(5,2),16)];
  var b = [parseInt(other.substr(1,2),16), parseInt(other.substr(3,2),16), parseInt(other.substr(5,2),16)];
  var o = a.map(function(v,i){ return Math.round(v + (b[i]-v)*t); });
  return '#' + o.map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
}

function applyTheme(t){
  var light = luma(t.bgTop) > 0.56;
  var surf = light ? mix(t.bgTop, '#FFFFFF', 0.02) : mix(t.bgTop, '#FFFFFF', 0.04);
  var root = document.documentElement.style;
  root.setProperty('--bg1', t.bgTop);
  root.setProperty('--bg2', t.bgBottom);
  root.setProperty('--tx', t.textMain);
  root.setProperty('--mu', t.textMuted);
  root.setProperty('--dm', t.textDim);
  root.setProperty('--ac', t.accent);
  root.setProperty('--trk', t.track);
  root.setProperty('--edge', light ? 'rgba(0,0,0,.13)' : 'rgba(255,255,255,.11)');
  root.setProperty('--surf1', surf);
  document.querySelectorAll('.tc').forEach(function(el){
    var c = THEMES[parseInt(el.dataset.i,10)];
    el.style.setProperty('--c1', c.bgTop);
    el.style.setProperty('--c2', c.bgBottom);
    el.style.setProperty('--ca', c.accent);
    el.style.setProperty('--ctx', c.textMain);
    el.classList.toggle('sel', parseInt(el.dataset.i,10) === state.sel);
  });
  document.getElementById('cnt').textContent = THEMES.length + ' 套';
}

function build(){
  var html = THEMES.map(function(t,i){
    return '<div class="tc" data-i="'+i+'" title="'+t.name+'">'+
      '<span class="sw"></span><span class="nm">'+shortName(t.name).split('').map(function(ch){return '<i>'+ch+'</i>';}).join('')+'</span></div>';
  }).join('');
  document.getElementById('grid').innerHTML = html;
  document.querySelectorAll('.tc').forEach(function(el){
    el.addEventListener('click', function(){
      state.sel = parseInt(el.dataset.i,10);
      applyTheme(THEMES[state.sel]);
      toast('已切到 <b>' + THEMES[state.sel].name + '</b>');
    });
  });
}

function toast(msg){
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

/* 滚动指示条 */
function syncBar(){
  var v = document.getElementById('view');
  var bar = document.getElementById('sbar'), thumb = document.getElementById('thumb');
  var track = bar.clientHeight;
  var ratio = v.clientHeight / v.scrollHeight;
  if (ratio >= 0.999) { bar.style.opacity = 0; return; }
  bar.style.opacity = 1;
  var h = Math.max(24, track * ratio);
  var max = v.scrollHeight - v.clientHeight;
  var y = max <= 0 ? 0 : (v.scrollTop / max) * (track - h);
  thumb.style.height = h + 'px';
  thumb.style.top = y + 'px';
}

document.getElementById('view').addEventListener('scroll', syncBar);

document.querySelectorAll('.bar button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.bar button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    document.getElementById('bubble').className = 'bubble v-' + b.dataset.v;
    document.getElementById('view').scrollTop = 0;
    syncBar();
  });
});

document.getElementById('newbtn').addEventListener('click', function(){
  toast('（预览）这里会打开现在的<b>调色盘</b>：以当前配色为起点，起完名字存成「我的主题」，建完立刻切过去');
});

/* 秒数走动，假装是活的 */
var s = 6*3600 + 24*60 + 7;
setInterval(function(){
  s = s > 0 ? s - 1 : 6*3600;
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  document.getElementById('num').textContent = ('0'+h).slice(-2)+':'+('0'+m).slice(-2)+':'+('0'+sec).slice(-2);
}, 1000);

build();
applyTheme(THEMES[0]);
syncBar();

/* ?v=0|a|b|c 直接定格某个方案，方便出对照图 */
(function(){
  var q = new URLSearchParams(location.search);
  var v = q.get('v');
  if (v === null) return;
  var btn = document.querySelector('.bar button[data-v="' + v + '"]');
  if (btn) btn.click();
})();
</script>
